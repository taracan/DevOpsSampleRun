# promote.yml: opens a PR that brings one ticket from code into alpha.
#
# Actions -> promote -> Run workflow, with a ticket (SP-7). It makes branch
# promote/SP-7 from alpha, cherry-picks, oldest first, every commit on code
# whose title starts with SP-7 and isn't in alpha yet (a feature's backend
# and frontend PRs share the ticket, so both halves come), and opens the PR
# "SP-7 ..." into alpha. Review it there: CI runs on the PR, and merging it
# deploys alpha (deploy-backend.yml / deploy-frontend.yml).
#
# On a conflict it stops and prints the git commands to make the same branch
# on your laptop, fix the conflict, push and open the PR yourself.
#
# The branch is pushed and the PR opened with ADMIN_TOKEN: a PR opened with
# the built-in token would not start the CI checks, and that token may not
# push commits that change files in .github/workflows/.

name: promote

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: "Ticket to bring into alpha, e.g. SP-7"
        required: true

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: alpha
          fetch-depth: 0 # all history, to compare code with alpha
          token: ${{ secrets.ADMIN_TOKEN }} # used for the push below

      - env:
          TICKET: ${{ inputs.ticket }}
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$TICKET" =~ ^[A-Z][A-Z0-9]+-[0-9]+$ ]] || { echo "::error::Not a ticket number: $TICKET"; exit 1; }
          branch="promote/$TICKET"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "::error::$branch already exists: finish or close its PR first."; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Commits on code, not yet (patch-equivalent) in alpha, titled "<ticket> ...".
          shas=$(git log --reverse --cherry-pick --right-only --format='%H %s' origin/alpha...origin/code |
            awk -v t="$TICKET" '$2 == t {print $1}')
          if [ -z "$shas" ]; then
            git log --format=%s origin/code | awk -v t="$TICKET" '$1 == t {f=1} END {exit !f}' ||
              { echo "::error::No commit on code is titled $TICKET"; exit 1; }
            echo "::notice::$TICKET is already in alpha: nothing to promote."; exit 0
          fi

          git switch -c "$branch" origin/alpha
          for sha in $shas; do
            if ! git cherry-pick -x "$sha"; then
              git cherry-pick --abort
              echo "::error::Conflict on $sha. Fix it on your laptop:"
              echo "  git fetch origin && git switch -c $branch origin/alpha"
              echo "  git cherry-pick -x $(echo $shas | tr '\n' ' ')"
              echo "  (fix the files, git add them, git cherry-pick --continue)"
              echo "  git push -u origin $branch, then open a PR into alpha titled \"$TICKET ...\""
              exit 1
            fi
          done
          git push origin "HEAD:refs/heads/$branch"

          # PR title: the ticket's first commit title, without its "(#71)" suffix.
          title=$(git log -1 --format=%s "$(echo "$shas" | head -1)" | sed -E 's/ \(#[0-9]+\)$//')
          {
            echo "Brings $TICKET from \`code\` into \`alpha\`. Merging deploys alpha."
            echo
            echo "Commits from code:"
            for sha in $shas; do echo "- $(git log -1 --format='%h %s' "$sha")"; done
          } > body.md
          gh pr create --base alpha --head "$branch" --title "$title" --body-file body.md
