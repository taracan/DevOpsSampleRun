# release.yml: the "release to beta" button. Ships alpha, as tested, to beta.
#
# Tickets reach alpha one PR at a time (promote.yml) and are tested there.
# Actions -> release -> Run workflow, with a version (1.3). Then:
#   1. cut       makes branch release/1.3 from alpha exactly as it is now
#                (nothing is picked or merged here, so nothing can conflict)
#   2. backend   deploy-backend.yml applies infra/backend/ to beta, then
#                ships the backend
#   3. frontend  deploy-frontend.yml applies infra/frontend/ to beta, then
#                ships the website (after the backend: it uses the backend's
#                load balancer)
# Steps 2 and 3 run only for the parts this release changes compared with
# the previous tag (folders below, plus that part's workflows). A change to
# infra/backend/ also re-runs the frontend, which reads the load balancer's
# address. The first release (no tag yet) runs both.
# Each Terraform and deploy job waits for your approval (GitHub environment "beta").
#
# When beta looks good, publish tag v1.3 on the release branch from the
# Releases page: the next release compares with it.
#
# The branch is pushed with ADMIN_TOKEN, because the built-in token may
# not push commits that change files in .github/workflows/.

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.3"
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-24.04-arm
    outputs:
      branch: ${{ steps.cut.outputs.branch }}
      backend: ${{ steps.cut.outputs.backend }}
      frontend: ${{ steps.cut.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: alpha
          fetch-depth: 0 # all history and tags
          token: ${{ secrets.ADMIN_TOKEN }} # used for the push below

      - id: cut
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::Version must look like 1.3"; exit 1; }
          branch="release/$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "::error::$branch already exists; pick a new version."; exit 1
          fi
          git push origin "HEAD:refs/heads/$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          # Which parts does this release change since the last tag? (true = deploy it)
          base=$(git tag -l 'v*' --sort=-v:refname | head -1)
          echo "Comparing with ${base:-nothing (first release)}"
          changed() { [ -z "$base" ] || ! git diff --quiet "$base" HEAD -- "$@"; }
          backend=false frontend=false
          changed backend infra/backend .github/workflows/deploy-backend.yml .github/workflows/terraform.yml && backend=true
          changed frontend infra/frontend infra/backend .github/workflows/deploy-frontend.yml .github/workflows/terraform.yml && frontend=true
          echo "Deploy backend: $backend, frontend: $frontend"
          [ "$backend$frontend" != falsefalse ] || echo "::notice::Nothing to deploy: this release changes neither part."
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  backend:
    needs: cut
    if: needs.cut.outputs.backend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-backend.yml
    with:
      env: beta
      ref: ${{ needs.cut.outputs.branch }}
    secrets:
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

  frontend:
    needs: [cut, backend]
    # Also when the backend was skipped, but not when it failed.
    if: ${{ !cancelled() && needs.cut.outputs.frontend == 'true' && needs.backend.result != 'failure' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      env: beta
      ref: ${{ needs.cut.outputs.branch }}
    secrets:
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
