# dependency-review.yml: blocks PRs that add a known-vulnerable dependency.
#
# On each PR, GitHub compares the dependencies before and after (pip, npm,
# GitHub Actions, ...) and checks every added or upgraded one against its
# advisory database. The check fails if any has a high or critical
# vulnerability, and it's required, so the PR can't merge. It also comments
# a summary on the PR when it finds something.
#
# Only runs on PRs: it reviews a change, and main only changes through PRs.

name: dependency-review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pull-requests: write # post the summary comment
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
