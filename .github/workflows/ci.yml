# ci.yml: the checks every pull request must pass before it can merge.
#
# Each job below is a separate check on the PR. The "main" ruleset
# (.github/settings/apply-settings.sh) lists them as required, so a PR is
# blocked until all of them are green on a branch that is up to date
# with main.
#
#   backend-lint   ruff: lint rules + formatting (backend/pyproject.toml)
#   backend-test   pytest against a real PostgreSQL 16 (the same major
#                  version as RDS), started as a service container
#   frontend-lint  ESLint (frontend/eslint.config.js)
#   frontend-test  Vitest + Testing Library, in jsdom (no browser, no backend)
#   build          the backend Docker image and the React app still build
#
# There are no path filters on purpose: a required check that is skipped
# because "nothing relevant changed" never reports, and the PR would wait
# forever. Every job is quick, so they always run.
#
# This workflow never touches AWS. Deploying is deploy.yml's job, on
# merges to main.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a PR cancels that PR's previous, now outdated run.
# Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend-lint:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave the token in .git/config

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12" # matches the python:3.12-slim image
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

  backend-test:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: backend
    # A throwaway PostgreSQL for this job only, reachable on localhost:5432.
    # The job waits until pg_isready reports it's accepting connections.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # The app's DB_* settings (app/core/config.py). The tests switch
    # DB_NAME to smallproject_test themselves (tests/conftest.py).
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave the token in .git/config

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Test
        run: pytest -v

  frontend-lint:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave the token in .git/config

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

  frontend-test:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave the token in .git/config

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Test
        run: npm test

  # Kept under the name "build", which was the only required check before
  # this workflow existed, so branch protection keeps working unchanged.
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave the token in .git/config

      - name: Build backend image
        run: docker build -t backend:check backend

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
