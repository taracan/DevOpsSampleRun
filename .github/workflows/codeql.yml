# codeql.yml: CodeQL, GitHub's code scanner, looks for security bugs.
#
# It reads the source (no build needed) and flags things like SQL
# injection, unsafe deserialization or secrets in logs. Findings appear
# under the repo's Security tab -> Code scanning, and as annotations on
# the PR. One job per language, each a required check on PRs:
#
#   analyze (python)                 backend/
#   analyze (javascript-typescript)  frontend/
#   analyze (actions)                .github/workflows (e.g. script injection)
#
# It also runs weekly, because new CodeQL rules can find old bugs in code
# that hasn't changed. Runs on x64 (ubuntu-latest), where CodeQL is best
# supported; nothing here needs to match the ARM production image.

name: codeql

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the findings to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave the token in .git/config

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
