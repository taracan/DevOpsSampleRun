# deploy.yml: CD with GitHub Actions. Deploys every merge to main.
#
# What GitHub Actions is: GitHub runs these jobs on its own machines
# ("runners") when something happens in the repo. Here:
#
#   Push/merge to main --> job "deploy"
#
# The checks on pull requests (lint, tests, build) live in ci.yml. Main
# only changes through PRs that passed them (the "main" ruleset), so this
# workflow doesn't repeat them.
#
# deploy:  1. signs in to AWS through OIDC: GitHub hands the job a
#             short-lived token and AWS trusts it only for main of this
#             repo (role smallproject-github-actions, infra/iam.tf). No
#             AWS keys are stored in GitHub.
#          2. builds the backend image and pushes it to ECR as :latest
#             (plus the commit SHA, so each version is traceable)
#          3. if migrations changed: snapshots the database first (keeps the
#             newest 3 pre-deploy snapshots), then runs the database
#             migrations (Alembic) as a one-off ECS task
#             with the new image, `python -m app.db.migrate`, in the same
#             private network as the service (RDS isn't reachable from
#             GitHub's runners). If it fails, the deploy stops here and the
#             old version keeps running.
#          4. restarts the ECS service on the new image and waits until
#             it is stable (a failed rollout rolls back automatically)
#          Steps 2-4 run only when backend/ or this file changed since
#          the previous main (or when that can't be determined), so a
#          frontend-only change skips the image build and ECS restart.
#          5. builds the React app and uploads it to the S3 web bucket
#          6. clears the CloudFront cache so visitors get the new files,
#             and waits until that has finished everywhere
#          7. smoke test: calls /api/v1/ready through CloudFront. Readiness
#             also logs in to the database, so a release that can't reach
#             RDS fails here (plain /health would still say "ok")
#
# Infrastructure changes are NOT deployed here: Terraform is applied
# from a laptop. The values below come from `terraform -chdir=infra output`.
#
# Runners are ARM (ubuntu-24.04-arm), to match the Fargate ARM64 tasks.

name: deploy

on:
  push:
    branches: [main]

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::631571737116:role/smallproject-github-actions
  ECR_REPOSITORY: 631571737116.dkr.ecr.us-east-1.amazonaws.com/smallproject-backend
  ECS_CLUSTER: smallproject
  ECS_SERVICE: smallproject-backend
  DB_INSTANCE: smallproject
  WEB_BUCKET: smallproject-web-631571737116
  CLOUDFRONT_DISTRIBUTION_ID: EWAOVPOVCP7SH
  SITE_URL: https://d3u96oxec6f0pb.cloudfront.net

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write # lets the job request the OIDC token for AWS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, to compare with the previous main
          persist-credentials: false # don't leave the token in .git/config

      # Compares the previous main (github.event.before) with this commit.
      # git diff --quiet exits 0 = no changes, 1 = changes, >1 = error
      # (e.g. unknown commit); anything but 0 deploys the backend, to be safe.
      - name: Check for backend changes
        id: changes
        run: |
          if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- backend .github/workflows/deploy.yml; then
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "No backend changes: skipping image build and ECS deploy."
          else
            echo "backend=true" >> "$GITHUB_OUTPUT"
          fi
          # New or changed migrations? Then take a database snapshot first.
          if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- backend/migrations; then
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign in to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sign in to ECR
        if: steps.changes.outputs.backend == 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push backend image
        if: steps.changes.outputs.backend == 'true'
        run: |
          docker build -t "$ECR_REPOSITORY:latest" -t "$ECR_REPOSITORY:${{ github.sha }}" backend
          docker push --all-tags "$ECR_REPOSITORY"

      # Safety net for schema changes: when this push changes migrations,
      # snapshot the database BEFORE they run (a few minutes) and keep only
      # the newest 3 of these snapshots. Restore one only in a disaster; the
      # restore drill (restore-drill.yml) checks that restoring works.
      - name: Snapshot the database before migrations
        if: steps.changes.outputs.backend == 'true' && steps.changes.outputs.migrations == 'true'
        run: |
          snap="smallproject-predeploy-${GITHUB_SHA::7}"
          if ! aws rds describe-db-snapshots --db-snapshot-identifier "$snap" > /dev/null 2>&1; then
            aws rds create-db-snapshot --db-instance-identifier "$DB_INSTANCE" --db-snapshot-identifier "$snap" > /dev/null
          fi
          aws rds wait db-snapshot-available --db-snapshot-identifier "$snap"
          echo "Snapshot ready: $snap"
          old=$(aws rds describe-db-snapshots --db-instance-identifier "$DB_INSTANCE" --snapshot-type manual \
            --query "sort_by(DBSnapshots[?starts_with(DBSnapshotIdentifier, 'smallproject-predeploy-')], &SnapshotCreateTime)[:-3].DBSnapshotIdentifier" \
            --output text)
          for o in $old; do
            echo "Deleting old pre-deploy snapshot: $o"
            aws rds delete-db-snapshot --db-snapshot-identifier "$o" > /dev/null
          done

      # One-off ECS task: same task definition as the service (its :latest
      # image is the one just pushed), same private subnets and security
      # group, command replaced by the migration entry point. Waits for it
      # to stop, prints its log, and fails the deploy unless it exited 0.
      - name: Run database migrations (one-off ECS task)
        if: steps.changes.outputs.backend == 'true'
        run: |
          svc=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0]')
          task=$(aws ecs run-task --cluster "$ECS_CLUSTER" --launch-type FARGATE \
            --task-definition "$(echo "$svc" | jq -r .taskDefinition)" \
            --network-configuration "$(echo "$svc" | jq -c .networkConfiguration)" \
            --overrides '{"containerOverrides":[{"name":"backend","command":["python","-m","app.db.migrate"]}]}' \
            --started-by "migrate-${GITHUB_SHA::7}" \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $task"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$task"
          result=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$task" \
            --query 'tasks[0].[containers[0].exitCode, stoppedReason]' --output text)
          echo "--- migration log ---"
          aws logs get-log-events --log-group-name /ecs/smallproject-backend \
            --log-stream-name "backend/backend/${task##*/}" --start-from-head \
            --query 'events[].message' --output text | tr '\t' '\n' || true
          echo "--- exit code and reason: $result"
          [ "$(echo "$result" | cut -f1)" = "0" ] || { echo "::error::Database migrations failed: $result"; exit 1; }

      - name: Deploy to ECS and wait until stable
        if: steps.changes.outputs.backend == 'true'
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --force-new-deployment > /dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and upload frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1 # same address as the page, via CloudFront
        run: |
          npm ci
          npm run build
          aws s3 sync dist "s3://$WEB_BUCKET" --delete

      - name: Clear CloudFront cache and wait
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --id "$id"

      # Readiness, not just liveness: the answer must say the database is ok.
      - name: Smoke test (readiness)
        run: |
          body=$(curl -fsS "$SITE_URL/api/v1/ready")
          echo "$body"
          echo "$body" | grep -q '"db":"ok"'
