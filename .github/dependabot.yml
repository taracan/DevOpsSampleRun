# dependabot.yml: Dependabot opens PRs that bump our dependencies.
#
# Kept deliberately quiet for a small project:
#   - Checked monthly, not weekly.
#   - All bumps for an ecosystem (patch, minor AND major) are grouped into
#     one PR, so there are at most 5 PRs a month, one per ecosystem below.
#     If a major bump in a group breaks something, the tests in CI show it.
#     Fix it in that PR, or tell Dependabot to skip that one dependency
#     (comment "@dependabot ignore <name> major version").
#   - pip: requirements.txt uses ">=" ranges, so every image build already
#     installs the newest versions. Dependabot only edits a range when it
#     blocks a newer release, instead of raising the floor every month.
#   - docker: moving Python to a new minor version (3.12 -> 3.14) changes
#     the production runtime, so that's done by hand, not by Dependabot.
#
# Security updates are separate from this file and still arrive as soon as
# an advisory is published.
#
#   pip             backend/requirements.txt
#   npm             frontend/package.json + package-lock.json
#   github-actions  the actions used in .github/workflows (keeps SHA pins fresh)
#   docker          the base image in backend/Dockerfile
#   terraform       the provider versions in infra/

version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    versioning-strategy: increase-if-necessary
    groups:
      pip:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-minor"]
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: monthly
    groups:
      terraform:
        patterns: ["*"]
