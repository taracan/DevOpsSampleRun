# alembic.ini: settings for Alembic, the database migration tool.
#
# Alembic keeps the database schema (tables, columns, indexes) in step with
# the code. Each change is a small numbered script in migrations/versions/,
# and the database remembers which scripts it has run (alembic_version
# table), so only new ones run.
#
# You normally don't call Alembic directly. Use the project's entry point,
# which also creates the database if needed:
#   python -m app.db.migrate          (laptop, tests, and the deploy)
#
# The database address is NOT in this file: migrations/env.py takes it from
# the app's settings (DB_* environment variables, app/core/config.py), so
# no password is ever written here.
#
# Make a new migration after changing a model (app/models/):
#   alembic revision --autogenerate -m "add phone to users"
# then read the generated script before committing it (see
# migrations/README.md for the rules).

[alembic]
script_location = %(here)s/migrations
path_separator = os
file_template = %%(rev)s_%%(slug)s
