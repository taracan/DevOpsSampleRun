# pyproject.toml: settings for the backend's dev tools (ruff and pytest).
# The backend isn't packaged; this file only configures those tools.
#
#   ruff check .          lint
#   ruff format .         format (CI runs `ruff format --check .`)
#   pytest                tests (needs Postgres: `docker compose up -d`)

[tool.ruff]
target-version = "py312" # matches the python:3.12-slim image
line-length = 100

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes (errors, unused names)
# I:   import sorting
# B:   bugbear (likely bugs)
# UP:  pyupgrade (modern Python syntax)
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."] # so tests can `import app`
